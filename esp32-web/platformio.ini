; ESP32-C3 Super Mini: WiFi web interface for the GPSDO. See README.md.
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
; app0 1.25 MB, app1 1.25 MB (OTA), LittleFS 1.4 MB
board_build.partitions = default.csv
monitor_speed = 115200
extra_scripts = pre:scripts/build_web.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Full power can make this board's WiFi unreliable: a setup network that was seen but refused connections
    -DWIFI_TX_POWER=WIFI_POWER_8_5dBm
lib_deps =
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
